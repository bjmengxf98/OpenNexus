<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>当前离线 - OpenNexus</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1020;color:#eef2ff;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:calc(22px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));background:radial-gradient(circle at 50% 0,#1e3a68 0,#0b1020 48%)}.card{width:min(430px,100%);padding:36px 28px;border:1px solid #334155;border-radius:20px;background:#111a2d;box-shadow:0 24px 70px #0007;text-align:center}.logo{width:76px;height:76px;margin:0 auto 20px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,#60a5fa,#4f46e5);font-size:27px;font-weight:900;letter-spacing:-2px}.brand{font-size:28px;font-weight:850;letter-spacing:2px}.sub{margin-top:5px;color:#9ca3af}.line{height:1px;margin:25px 0;background:#29334d}h1{font-size:20px;margin:0 0 12px}p{margin:0;color:#aab4c6;line-height:1.8}button{margin-top:24px;border:0;border-radius:10px;padding:11px 22px;background:#4f7cf3;color:#fff;font:inherit;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">NX</div>
    <div class="brand">OpenNexus</div>
    <div class="sub">多维表格智能助手</div>
    <div class="line"></div>
    <h1>当前没有网络连接</h1>
    <p>已打开离线提示页。恢复网络后，可继续使用对话、WPS 表格、驾驶舱和消息提醒等功能。</p>
    <button id="reconnect" type="button">重新连接</button>
  </main>
  <script>
    let reconnecting=false;
    async function reconnect(manual=false){
      if(reconnecting)return;
      reconnecting=true;
      const button=document.getElementById('reconnect');
      if(manual)button.textContent='正在连接…';
      try{
        const response=await fetch('/manifest.json?reconnect='+Date.now(),{cache:'no-store'});
        if(response.ok){
          if(location.pathname==='/offline')location.replace('/login');
          else location.reload();
          return;
        }
      }catch(_error){}
      reconnecting=false;
      if(manual)button.textContent='重新连接';
    }
    document.getElementById('reconnect').addEventListener('click',()=>reconnect(true));
    window.addEventListener('online',()=>reconnect(false));
    setInterval(()=>reconnect(false),2000);
  </script>
</body>
</html>
