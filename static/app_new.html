  <script>

  </script>
  <style>
    :root{--primary:#6366f1;--primary2:#8b5cf6;--bg:#f5f6fa;--panel:#fff;--line:#e5e7eb;--text:#202334;--muted:#8a93a6;--sidebar:#f0f1f7;--bubble:#e8eaf6;--shadow:0 1px 3px rgba(0,0,0,.08);--chat-size:15px;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;color:var(--text);background:var(--bg)}button,input,textarea,select{font:inherit}button{cursor:pointer}
    .app{position:fixed;left:0;top:0;width:100%;height:var(--app-height,100dvh);display:grid;grid-template-rows:54px minmax(0,1fr);overflow:hidden}.topbar{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;background:#fff;border-bottom:1px solid #e3e5ed;box-shadow:0 1px 4px rgba(0,0,0,.07)}
    .top-left,.top-right{display:flex;align-items:center;min-width:0}.top-left{gap:8px}.top-right{gap:6px;margin-left:auto}.menu-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:transparent;color:#6b7280;font-size:20px;padding:0;flex:0 0 auto}.menu-btn:hover{background:#f3f4f6}.brand{font-weight:800;font-size:19px;letter-spacing:2px;background:linear-gradient(135deg,#60a5fa,#a78bfa);-webkit-background-clip:text;color:transparent;white-space:nowrap}.brand-sub{font-size:16px;font-weight:700;white-space:nowrap}.pill,.top-link{border:1px solid #d9dce8;border-radius:20px;background:#fff;padding:4px 12px;color:#4f46e5;text-decoration:none;white-space:nowrap;font-size:13px}.file-select{max-width:200px;background:#ede9fe;border-color:#c4b5fd;color:#6d28d9}.wps-wrap{position:relative;display:inline-flex}.wps{font-weight:500}.wps.ok{color:#16a34a;background:#dcfce7;border-color:transparent}.wps.bad{color:#dc2626;background:#fee2e2;border-color:transparent}.wps-menu{position:absolute;right:0;top:calc(100% + 7px);z-index:80;min-width:112px;padding:5px;background:#fff;border:1px solid #e5e7eb;border-radius:9px;box-shadow:0 7px 24px rgba(15,23,42,.16)}.wps-menu a,.wps-menu button{display:block;width:100%;padding:8px 11px;border:0;border-radius:6px;background:transparent;color:#374151;text-align:left;text-decoration:none;font-size:13px}.wps-menu a:hover,.wps-menu button:hover{background:#f3f4f6}.wps-menu .danger{color:#dc2626}.top-link{border:0;padding:5px 3px}.top-link.admin{color:#f59e0b}.top-link.logout{color:#ef4444}.who{color:#475467;font-size:14px;white-space:nowrap}
    .workspace{min-width:0;min-height:0;overflow:hidden;display:grid;grid-template-columns:220px minmax(0,1fr);transition:grid-template-columns .2s}.workspace.sidebar-hidden{grid-template-columns:0 minmax(0,1fr)}.workspace.sidebar-hidden .sidebar{visibility:hidden;overflow:hidden;border-right:0}.sidebar{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--sidebar);border-right:1px solid #dfe2eb}.new-chat{margin:14px 10px 10px;padding:8px 12px;border:1px solid rgba(99,102,241,.25);border-radius:8px;background:rgba(99,102,241,.1);color:#4f46e5;text-align:left;font-size:13px}.conv-list{overflow:auto;padding:0 6px 18px}.group-label{padding:10px 8px 3px;color:#9ca3af;font-size:11px;font-weight:600}.conv{position:relative;display:flex;align-items:center;min-height:34px;padding:7px 8px;border-radius:6px;color:#374151;cursor:pointer}.conv:hover{background:rgba(0,0,0,.05)}.conv.active{background:rgba(99,102,241,.15);color:#4f46e5}.conv-title{min-width:0;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px;cursor:pointer}.conv-time{flex:0 0 auto;margin-left:7px;margin-right:27px;color:#9ca3af;font-size:11px;white-space:nowrap}.conv-menu{display:none;position:absolute;z-index:2;right:3px;top:50%;width:28px;height:28px;transform:translateY(-50%);border:0;border-radius:5px;background:transparent;color:#9ca3af;font-size:14px;line-height:28px;text-align:center;cursor:pointer}.conv-menu:hover{background:rgba(99,102,241,.1);color:#6366f1}.conv:hover .conv-menu,.conv.active .conv-menu{display:block}

    .input-bar{position:relative;z-index:10;min-width:0;border-top:1px solid #e0e3eb;background:#fff;padding:10px 20px 12px;box-shadow:0 -2px 10px rgba(0,0,0,.06)}.input-inner{width:100%;max-width:780px;margin:auto;display:flex;flex-direction:column;gap:7px}.upload-ready{padding:10px 14px;border-left:3px solid #22c55e;border-radius:8px;background:#ecfdf3;color:#18723a;font-size:13px;line-height:1.55}.upload-ready.pending{border-left-color:#60a5fa;background:#eff6ff;color:#2563a8}.upload-ready.error{border-left-color:#ef4444;background:#fff1f2;color:#b91c1c}.upload-ready strong{font-weight:700}.composer{position:relative;min-width:0;display:flex;align-items:flex-end;gap:8px;border:2px solid #4b91ef;border-radius:12px;padding:7px 10px;background:#fff}.composer.dragging{border-color:#7c3aed;background:#faf5ff}.composer-tool{position:relative;flex:0 0 38px;width:38px;height:38px;margin:0;border:1px solid #d7dbe6;border-radius:50%;background:#f8fafc;color:#697386;padding:0}.plus-icon,.plus-icon::before,.plus-icon::after{position:absolute;display:block;content:"";background:currentColor;border-radius:2px}.plus-icon{left:50%;top:50%;width:0;height:0;background:transparent}.plus-icon::before{width:16px;height:2px;left:-8px;top:-1px}.plus-icon::after{width:2px;height:16px;left:-1px;top:-8px}.composer-tool:hover,.composer-tool.open{border-color:#a5b4fc;background:#eef2ff;color:#4f46e5}.input-tools{position:absolute;left:8px;bottom:calc(100% + 9px);z-index:35;width:190px;padding:6px;display:grid;gap:2px;border:1px solid #dfe3ec;border-radius:10px;background:#fff;box-shadow:0 10px 28px rgba(15,23,42,.18)}.tool-btn{width:100%;border:0;border-radius:7px;background:#fff;color:#374151;padding:9px 11px;font-size:13px;text-align:left;white-space:nowrap}.tool-btn:hover{background:#f3f4f6}.tool-btn.purple{color:#5b4bd8}.tool-btn.orange{color:#e68a00}.tool-btn.active{background:#ede9fe;color:#5b21b6}.composer textarea{min-width:0;width:100%;min-height:38px;max-height:150px;border:0;outl     html[data-theme="dark"]{--bg:#151719;--panel:#1f2226;--line:#363b43;--text:#e8eaed;--muted:#9ba3af;--sidebar:#1b1f23;--bubble:#2b3038;--shadow:0 1px 4px rgba(0,0,0,.38);color-scheme:dark}
    html[data-theme="dark"] .topbar,html[data-theme="dark"] .input-bar,html[data-theme="dark"] .composer,html[data-theme="dark"] .input-tools,html[data-theme="dark"] .wps-menu,html[data-theme="dark"] .toast,html[data-theme="dark"] .dialog,html[data-theme="dark"] .help{background:var(--panel);border-color:var(--line)}
    html[data-theme="dark"] .topbar{box-shadow:0 1px 5px rgba(0,0,0,.35)}html[data-theme="dark"] .sidebar{border-color:var(--line)}html[data-theme="dark"] .brand-sub,html[data-theme="dark"] .welcome,html[data-theme="dark"] .bubble,html[data-theme="dark"] .composer textarea{color:var(--text)}

    html[data-theme="dark"] .tool-btn,html[data-theme="dark"] .wps-menu a,html[data-theme="dark"] .wps-menu button,html[data-theme="dark"] .dialog button{background:transparent;color:#d8dce2}html[data-theme="dark"] .tool-btn.purple{color:#b6afff}html[data-theme="dark"] .tool-btn.orange{color:#ffb44a}html[data-theme="dark"] .tool-btn.active{background:#3c3560;color:#d1ccff}html[data-theme="dark"] .assistant .bubble table{background:#20242a}html[data-theme="dark"] .assistant .bubble th,html[data-theme="dark"] .assistant .bubble td{border-color:#3a4049}html[data-theme="dark"] .assistant .bubble th{background:#292d38;color:#aaa6ff}html[data-theme="dark"] .chip{background:#393451;color:#cbc7ff}
    html[data-theme="dark"] .status{background:#172a46;color:#8fc0ff}html[data-theme="dark"] .status.error{background:#3a2024;color:#ffaaaa}html[data-theme="dark"] .status.notice{background:#352c18;color:#ffd27a}html[data-theme="dark"] .new-chat{background:#302c4c;border-color:#585285;color:#bbb5ff}html[data-theme="dark"] .wps.ok{background:#153b29;color:#6ee7a3}html[data-theme="dark"] .wps.bad{background:#49252a;color:#ff9ca5}html[data-theme="dark"] .upload-ready{background:#173326;color:#83e5aa}html[data-theme="dark"] .upload-ready.pending{background:#192d45;color:#91c6ff}html[data-theme="dark"] .upload-ready.error{background:#3a2024;color:#ffaaaa}html[data-theme="dark"] .assistant .bubble strong,html[data-theme="dark"] .assistant .bubble h1,html[data-theme="dark"] .assistant .bubble h2,html[data-theme="dark"] .assistant .bubble h3,html[data-theme="dark"] .assistant .bubble h4,html[data-theme="dark"] .assistant .bubble h5,html[data-theme="dark"] .assistant .bubble h6{color:var(--text)}html[data-theme="dark"] .assistant .bubble code{background:#292d35;color:#c7bfff}html[data-theme="dark"] .assistant .bubble tr:nth-child(even) td{background:#24282e}html[data-theme="dark"] .assistant .bubble blockquote{background:#2d2941;color:#c7bfff}html[data-theme="dark"] .help-close{background:#30343a;color:#cbd0d8}html[data-theme="dark"] .help-body code{background:#2b3036;color:#d8dee9}html[data-theme="dark"] .help-body pre{background:#17191c;color:#e8eaed;border-color:#3f4650}
    @media(max-width:1350px){.who{display:none}.top-right{gap:4px}.top-link{font-size:12px}}
    @media(max-width:1050px){.role,.brand-sub,.top-link.help-link{display:none}.topbar{padding:0 12px}.workspace{grid-template-columns:200px minmax(0,1fr)}.workspace.sidebar-hidden{grid-template-columns:0 minmax(0,1fr)}.chat-scroll{padding-left:28px;padding-right:28px}}
    @media(max-width:720px){.app{grid-template-rows:58px minmax(0,1fr)}.topbar{height:58px;padding:5px 8px;display:flex;flex-wrap:nowrap;gap:5px}.top-left{order:1;gap:5px;flex:0 1 auto}.brand{font-size:18px;font-weight:900;letter-spacing:1.2px;background:linear-gradient(135deg,#2563eb,#6d28d9);-webkit-background-clip:text;background-clip:text;color:transparent}.brand-sub{display:none}.top-right{display:contents}.top-link,.who,.role{display:none!important}.file-select{display:block;order:2;flex:1 1 auto;min-width:78px;width:auto;max-width:150px;height:34px;padding:4px 7px}.wps-wrap{order:3;margin-left:0;flex:0 0 auto}.wps{padding:6px 8px;font-size:12px}.workspace,.workspace.sidebar-hidden{display:grid;grid-template-columns:minmax(0,1fr)}.workspace.sidebar-hidden .sidebar{visibility:visible}.sidebar{position:fixed;z-index:40;top:58px;bottom:0;left:0;width:285px;transform:translateX(-102%);transition:.2s;box-shadow:8px 0 26px rgba(15,23,42,.16);pointer-events:auto}.sidebar.open{transform:none;visibility:visible!important}.main{grid-column:1;height:auto;min-height:0}.chat-scroll{padding:18px 18px 16px}.bubble{max-width:92%;font-size:var(--chat-size)}.user .bubble{padding:10px 14px}.input-bar{padding:8px 10px calc(8px + env(safe-area-inset-bottom))}.tool-btn{white-space:nowrap}.composer{padding:7px 8px;border-radius:18px}.composer textarea{font-size:16px}.send{flex-basis:42px;height:42px}.help{top:58px}.help-body{padding:18px 20px calc(28px + env(safe-area-inset-bottom))}.help-body code{white-space:normal;overflow-wrap:anywhere}.toast-wrap{top:68px;right:10px;left:10px}.toast{min-width:0;max-width:none}}

<body>
<div class="app">
  <header class="topbar">
    <div class="top-left"><button class="menu-btn" id="menuBtn" aria-label="打开会话列表">☰</button><span class="brand">OpenNexus</span><span class="brand-sub">多维表格智能助手</span></div>
    <div class="top-right">
      <select id="fileSelect" class="pill file-select" title="当前多维表格"></select>
      <span id="roleBadge" class="pill role"></span><span id="displayName" class="who"></span>
      <div class="wps-wrap">
        <button id="wpsBadge" class="pill wps bad" type="button">WPS: 未连接</button>
        <div id="wpsMenu" class="wps-menu hidden">
          <a id="wpsReauth" href="#">重新授权</a>
          <button id="wpsDisconnect" class="danger" type="button">断开连接</button>
        </div>
      </div>
      <a class="top-link" href="/dashboard">驾驶舱</a><button class="top-link help-link" id="helpBtn">帮助</button>
      <a class="top-link" href="/settings">设置</a><a id="adminLink" class="top-link admin hidden" href="/admin">管理</a><a class="top-link logout" href="/api/logout">退出</a>
    </div>
  </header>
  <div class="workspace" id="workspace">
    <aside class="sidebar" id="sidebar"><button class="new-chat" id="newChat">＋ 新对话</button><nav class="mobile-nav" aria-label="手机功能菜单"><a href="/dashboard">驾驶舱</a><button id="mobileHelpBtn" type="button">帮助</button><a href="/settings">设置</a><button id="mobileUpdateBtn" type="button">检查更新</button><a class="danger" href="/api/logout">退出</a></nav><div class="conv-list" id="convList"></div></aside>
    <main class="main">
      <div class="chat-scroll" id="chatScroll"><div class="chat-inner" id="chatInner"></div></div>
      <div class="input-bar"><div class="input-inner">
        <div class="upload-ready hidden" id="uploadReady"></div>
        <div class="chips hidden" id="chips"></div>
        <div class="composer">
          <button class="composer-tool" id="toolMenuBtn" title="附件与清理" aria-label="附件与清理" aria-expanded="false"><span class="plus-icon" aria-hidden="true"></span></button>
          <div class="input-tools hidden" id="toolMenu">
            <button class="tool-btn purple" id="uploadBtn">📎 上传附件</button>
            <button class="tool-btn" id="attachMode">📁 作为附件上传</button>
            <button class="tool-btn" id="clearChat">🧹 清空当前对话</button>
            <button class="tool-btn orange" id="clearFiles">🗑 清除已上传文件</button>
          </div>
          <input class="hidden" id="fileInput" type="file" multiple accept=".txt,.md,.docx,.doc,.docm,.xlsx,.xls,.xlsm,.pptx,.ppt,.pdf,.png,.jpg,.jpeg,.webp,.gif,.bmp,.csv,.zip,.rar">
          <textarea id="messageInput" rows="1" placeholder="输入指令…（Enter 发送，Shift+Enter 换行）"></textarea><button class="send" id="sendBtn" aria-label="发送">↑</button>
        </div>
      </div></div>
    </main>
  </div>
  <div class="panel-overlay hidden" id="sidebarOverlay"></div>
</div>
<div class="toast-wrap" id="toasts"></div>
<div class="panel-overlay help-overlay hidden" id="helpOverlay"></div>
<section class="help hidden" id="helpPanel"><div class="help-header"><h2>📖 使用帮助</h2><button class="help-close" id="helpClose" aria-label="关闭帮助">×</button></div><div class="help-body" id="helpBody"><div class="help-loading">正在加载帮助…</div></div></section>

<script>
const state={user:null,wps:null,conversations:[],currentId:0,sending:false,uploading:false,files:[],asAttachment:false,lastMessageAt:null,helpLoaded:false,activeTurnId:'',lastEventId:0};
const $=s=>document.querySelector(s);const chat=$('#chatInner'),scroll=$('#chatScroll'),input=$('#messageInput'),sendBtn=$('#sendBtn');
const roles={admin:'超级管理员',executive:'高层管理',manager:'部门负责人',staff:'员工'};
(function applySavedFontSize(){const sizes={small:'13px',medium:'15px',large:'17px'};document.documentElement.style.setProperty('--chat-size',sizes[localStorage.getItem('chat_font_size')]||'15px')})();
(function followSystemTheme(){const media=window.matchMedia('(prefers-color-scheme:dark)');media.addEventListener?.('change',e=>{if((localStorage.getItem('appearance_theme')||'system')==='system')document.documentElement.dataset.theme=e.matches?'dark':'light'})})();
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(message,type=''){const el=document.createElement('div');el.className='toast '+type;el.textContent=message;$('#toasts').append(el);setTimeout(()=>el.remove(),3500)}
function scrollBottom(smooth=false){requestAnimationFrame(()=>{if(smooth)scroll.scrollTo({top:scroll.scrollHeight,behavior:'smooth'});else scroll.scrollTop=scroll.scrollHeight})}
function formatTime(v){const d=parseConversationTime(v);if(!d)return'';const now=new Date(),pad=n=>String(n).padStart(2,'0'),clock=pad(d.getHours())+':'+pad(d.getMinutes());if(d.toDateString()===now.toDateString())return clock;if(d.getFullYear()===now.getFullYear())return pad(d.getMonth()+1)+'月'+pad(d.getDate())+'日 '+clock;return d.getFullYear()+'年'+pad(d.getMonth()+1)+'月'+pad(d.getDate())+'日 '+clock}
function addTimestamp(v){if(!v)return;const e=document.createElement('div');e.className='timestamp';e.textContent=formatTime(v);chat.append(e)}
function addMessage(role,content,htmlValue='',created='',autoScroll=true){if(created){const now=parseConversationTime(created),prev=state.lastMessageAt?parseConversationTime(state.lastMessageAt):null;if(!prev||!now||now-prev>=300000)addTimestamp(created);state.lastMessageAt=created}const row=document.createElement('div');row.className='message '+role;if(role==='assistant'){row.innerHTML='<div class="avatar">✦</div><div class="bubble">'+(htmlValue||esc(content).replace(/\n/g,'<br>'))+'</div>'}else{row.innerHTML='<div class="bubble">'+esc(content).replace(/\n/g,'<br>')+'</div>'}chat.append(row);if(autoScroll)scrollBottom(true);return row}
function setStatus(text,kind=''){let el=$('#liveStatus');if(!el){el=document.createElement('div');el.id='liveStatus';chat.append(el)}el.className='status '+kind;el.textContent=text;scrollBottom(true)}
function clearStatus(){const e=$('#liveStatus');if(e)e.remove()}
function welcome(){state.lastMessageAt=null;chat.innerHTML='<div class="welcome"><div class="message assistant"><div class="avatar">✦</div><div class="bubble"><p>你好，'+esc(state.user?.display_name||'')+'！我是你的多维表格智能助手。</p><p>你可以直接查询任务、人员和工作进展，也可以上传文件让我分析或写入表格。</p><p>'+ (state.wps?.default_file?'已配置默认表格：<b>'+esc(state.wps.default_file.file_name||state.wps.default_file.file_id)+'</b>':'请先在设置中添加多维表格链接') +'</p></div></div></div>'}
function parseConversationTime(value){if(!value)return null;let text=String(value).trim().replace(' ','T');if(!/[zZ]|[+-]\d\d:?\d\d$/.test(text))text+='Z';const date=new Date(text);return Number.isNaN(date.getTime())?null:date}
function conversationTimeLabel(value){const date=parseConversationTime(value);if(!date)return'';const now=new Date(),pad=n=>String(n).padStart(2,'0');return date.toDateString()===now.toDateString()?pad(date.getHours())+':'+pad(date.getMinutes()):(date.getFullYear()===now.getFullYear()?pad(date.getMonth()+1)+'/'+pad(date.getDate()):pad(date.getFullYear()%100)+'/'+pad(date.getMonth()+1)+'/'+pad(date.getDate()))}
function renderConversations(){const box=$('#convList');box.innerHTML='';if(!state.conversations.length){box.innerHTML='<div class="group-label">暂无对话</div>';return}const now=new Date(),startToday=new Date(now.getFullYear(),now.getMonth(),now.getDate()),startYesterday=new Date(startToday);startYesterday.setDate(startYesterday.getDate()-1);const startSeven=new Date(startToday);startSeven.setDate(startSeven.getDate()-7);const groups=[['今天',[]],['昨天',[]],['7天内',[]],['更早',[]]];state.conversations.forEach(c=>{const d=parseConversationTime(c.updated_at);if(d&&d>=startToday)groups[0][1].push(c);else if(d&&d>=startYesterday)groups[1][1].push(c);else if(d&&d>=startSeven)groups[2][1].push(c);else groups[3][1].push(c)});groups.forEach(([name,items])=>{if(!items.length)return;const label=document.createElement('div');label.className='group-label';label.textContent=name;box.append(label);items.forEach(c=>{const e=document.createElement('div');e.className='conv '+(Number(c.id)===Number(state.currentId)?'active':'');e.dataset.id=c.id;e.innerHTML='<span class="conv-title">'+esc(c.title||'新对话')+'</span><span class="conv-time">'+esc(conversationTimeLabel(c.updated_at))+'</span><button class="conv-menu" title="更多">⋯</button>';e.onclick=()=>selectConversation(c.id);e.querySelector('.conv-menu').onclick=ev=>{ev.stopPropagation();conversationMenu(c)};box.append(e)})})}
function conversationMenu(c){if(state.sending)return toast('请先停止当前回复');const o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="dialog"><h3>管理对话</h3><label style="display:block;color:#667085;margin-bottom:7px">对话名称</label><input class="rename-input" style="width:100%;border:1px solid #d6d9e4;border-radius:8px;padding:10px 12px" value="'+esc(c.title||'')+'"><div class="dialog-actions"><button class="delete" style="color:#dc2626;margin-right:auto">删除对话</button><button class="cancel">取消</button><button class="primary">保存</button></div></div>';o.querySelector('.cancel').onclick=()=>o.remove();o.querySelector('.primary').onclick=async()=>{const title=o.querySelector('.rename-input').value.trim();if(!title)return;const r=await fetch('/api/conversations/'+c.id+'/title',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({title})});if(r.ok){c.title=title;renderConversations();o.remove()}};o.querySelector('.delete').onclick=()=>{o.remove();showConfirm('确认删除这个对话吗？',async()=>{await fetch('/api/conversations/'+c.id,{method:'DELETE'});state.conversations=state.conversations.filter(x=>x.id!==c.id);state.currentId=state.conversations[0]?.id||0;renderConversations();state.currentId?loadMessages(state.currentId):welcome()})};document.body.append(o);o.querySelector('.rename-input').focus()}
function closeMobileSidebar(){$('#sidebar').classList.remove('open');$('#sidebarOverlay').classList.add('hidden')}
async function selectConversation(id){if(state.sending)return toast('请等待当前回复完成');state.currentId=Number(id);renderConversations();await loadMessages(id);closeMobileSidebar()}
async function loadMessages(id){chat.innerHTML='<div class="status">正在加载会话…</div>';try{const r=await fetch('/api/app-new/conversations/'+id+'/messages');if(r.status===401)return location.href='/login?next=/app-new';const d=await r.json();if(!d.ok)throw new Error(d.error||'会话加载失败');chat.innerHTML='';state.lastMessageAt=null;if(!d.messages.length)return welcome();d.messages.forEach(m=>addMessage(m.role,m.content,m.html,m.created_at,false));scrollBottom(false)}catch(e){chat.innerHTML='<div class="status error">'+esc(e.message||'会话加载失败')+'</div>'}}
async function bootstrap(){const r=await fetch('/api/app-new/bootstrap');if(r.status===401)return location.href='/login?next=/app-new';const d=await r.json();if(!d.ok)return toast(d.error||'加载失败','error');Object.assign(state,{user:d.user,wps:d.wps,conversations:d.conversations||[],currentId:d.current_conversation_id||0,activeTurnId:d.active_turn?.id||'',lastEventId:0});$('#displayName').textContent=d.user.display_name;$('#roleBadge').textContent=roles[d.user.role]||d.user.role;$('#adminLink').classList.toggle('hidden',!d.user.is_admin);const w=$('#wpsBadge');w.textContent='WPS: '+(d.wps.connected?d.wps.username:'未连接');w.className='pill wps '+(d.wps.connected?'ok':'bad');$('#wpsReauth').href=d.wps.connect_url||'#';$('#wpsDisconnect').classList.toggle('hidden',!d.wps.connected);const fs=$('#fileSelect');fs.innerHTML='';(d.wps.files||[]).forEach(f=>{const o=document.createElement('option');o.value=f.file_id;o.textContent=f.file_name||f.file_id;o.selected=d.wps.default_file&&f.file_id===d.wps.default_file.file_id;fs.append(o)});if(!fs.children.length){fs.innerHTML='<option>部门事务（默认）</option>';fs.disabled=true}if(innerWidth>720&&localStorage.getItem('sb_open')==='0')$('#workspace').classList.add('sidebar-hidden');renderConversations();state.currentId?await loadMessages(state.currentId):welcome();if(state.activeTurnId)await resumeTurn(state.activeTurnId)}
async function createConversation(){if(state.sending)return;state.currentId=0;chat.innerHTML='';welcome();renderConversations();input.focus();closeMobileSidebar()}
function updateSendState(){const usable=!state.sending&&!state.uploading&&(!!input.value.trim()||!!state.files.length);sendBtn.disabled=state.uploading;sendBtn.textContent=state.sending?'■':'↑';sendBtn.title=state.sending?'停止本次回复':'发送';sendBtn.classList.toggle('ready',usable);sendBtn.classList.toggle('stop',state.sending)}
function setSending(on){state.sending=on;updateSendState()}
function setUploading(on){state.uploading=on;updateSendState()}
async function readEventStream(res){const reader=res.body.getReader(),decoder=new TextDecoder();let buf='';while(true){const {value,done}=await reader.read();if(done)break;buf+=decoder.decode(value,{stream:true});const frames=buf.split('\n\n');buf=frames.pop();for(const frame of frames){const line=frame.split('\n').find(x=>x.startsWith('data: '));if(!line)continue;handleEvent(JSON.parse(line.slice(6)))}}}
async function resumeTurn(turnId,afterId=null){try{const statusRes=await fetch('/api/app-new/turns/'+encodeURIComponent(turnId));if(statusRes.status===401)return location.href='/login?next=/app-new';const statusData=await statusRes.json();if(!statusData.ok){state.activeTurnId='';throw new Error(statusData.error||'任务恢复失败')}const turn=statusData.turn;if(['completed','failed','cancelled','interrupted'].includes(turn.status)){state.activeTurnId='';if(turn.status==='completed')await loadMessages(turn.conversation_id);else setStatus(turn.error||'上次任务未完成','error');return}state.activeTurnId=turnId;setStatus('正在恢复未完成的回复…');setSending(true);const cursor=afterId===null?turn.last_event_id:afterId;const res=await fetch('/api/app-new/turns/'+encodeURIComponent(turnId)+'/events?after='+encodeURIComponent(cursor));if(!res.ok){if(res.status===404)state.activeTurnId='';throw new Error('任务事件恢复失败')}await readEventStream(res)}catch(e){setStatus(e.message||String(e),'error')}finally{setSending(!!state.activeTurnId);input.focus()}}
async function cancelActiveTurn(){if(!state.activeTurnId)return;setStatus('正在停止本次回复…','notice');try{const r=await fetch('/api/app-new/turns/'+encodeURIComponent(state.activeTurnId)+'/cancel',{method:'POST'});const d=await r.json();if(!d.ok)throw new Error(d.error||'停止失败')}catch(e){setStatus(e.message||'停止失败','error')}}
async function send(){const text=input.value.trim();if(state.sending||state.uploading||(!text&&!state.files.length))return;const shown=[text,...state.files.map(f=>'📎 '+f.name)].filter(Boolean).join('\n');input.value='';resizeInput();addMessage('user',shown);setStatus(state.files.length?'正在分析文档，请稍候…':'正在思考…');setSending(true);state.lastEventId=0;const payload={text,conversation_id:state.currentId,as_attachment:state.asAttachment};state.files=[];renderChips();try{const res=await fetch('/api/app-new/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(res.status===401)return location.href='/login?next=/app-new';if(!res.ok){let d={};try{d=await res.json()}catch{}throw new Error(d.error||'请求失败')}state.activeTurnId=res.headers.get('X-Agent-Turn-ID')||state.activeTurnId;await readEventStream(res);if(state.activeTurnId)await resumeTurn(state.activeTurnId,state.lastEventId)}catch(e){if(state.activeTurnId){setStatus('连接中断，正在重新连接…','notice');await resumeTurn(state.activeTurnId,state.lastEventId)}else setStatus(e.message||String(e),'error')}finally{if(!state.activeTurnId)setSending(false);input.focus()}}
function handleEvent(e){if(e.turn_id)state.activeTurnId=e.turn_id;if(e.event_id)state.lastEventId=Math.max(state.lastEventId,Number(e.event_id)||0);if(e.type==='accepted'){state.currentId=Number(e.conversation_id);let c=state.conversations.find(x=>Number(x.id)===state.currentId);if(!c){c={id:state.currentId,title:e.title||'新对话',updated_at:new Date().toISOString()};state.conversations.unshift(c)}else c.updated_at=new Date().toISOString();renderConversations()}else if(e.type==='tool'){setStatus('⚙️ 正在调用：'+e.name)}else if(e.type==='file'){setStatus(e.status==='done'?'已解析：'+e.name:'正在解析：'+e.name+'…')}else if(e.type==='notice'){toast(e.message)}else if(e.type==='done'){state.activeTurnId='';clearStatus();addMessage('assistant',e.reply,e.html);const c=state.conversations.find(x=>Number(x.id)===Number(e.conversation_id));if(c){if(e.title)c.title=e.title;c.updated_at=new Date().toISOString()}renderConversations()}else if(e.type==='cancelled'){state.activeTurnId='';setStatus(e.message||'已停止本次回复','notice')}else if(e.type==='error'){state.activeTurnId='';setStatus(e.message,'error')}}
function showUploadNotice(text,pending=false,error=false){const box=$('#uploadReady');box.textContent=text;box.classList.remove('hidden');box.classList.toggle('pending',pending);box.classList.toggle('error',error)}
async function uploadFiles(files){if(!files.length)return;if(state.uploading)return toast('文件正在上传，请稍候');const isImage=file=>file.type?.startsWith('image/')||/\.(png|jpe?g|webp|gif|bmp)$/i.test(file.name||'');const allImages=files.every(isImage),errors=[];showUploadNotice((allImages?'图片':'文件')+'正在上传…',true);setUploading(true);try{for(const file of files){try{const fd=new FormData();fd.append('file',file);const r=await fetch('/api/upload_temp',{method:'POST',body:fd,credentials:'same-origin'});if(r.status===401||r.status===403){location.href='/login?next=/app-new';return}const d=await r.json();if(d.ok)state.files.push({name:d.name,icon:d.icon,is_image:isImage(file)});else errors.push(d.error||file.name+' 上传失败')}catch(e){errors.push(file.name+'：'+(e.message||'网络错误'))}}if(state.files.length)renderChips();if(errors.length){toast(errors.join('；'),'error');if(!state.files.length)showUploadNotice('⚠️ 上传失败：'+errors.join('；'),false,true)}}finally{setUploading(false)}}
function renderChips(){const box=$('#chips'),notice=$('#uploadReady');box.innerHTML='';box.classList.toggle('hidden',!state.files.length);if(state.files.length){const names=state.files.map(f=>f.name).join('、'),allImages=state.files.every(f=>f.is_image);notice.innerHTML=(allImages?'🖼️ 图片已就绪：':'📄 文件已就绪：')+'<strong>'+esc(names)+'</strong>，请输入指令后发送，或直接点击发送让 AI '+(allImages?'识别':'处理')+'。';notice.classList.remove('hidden','pending','error')}else{notice.classList.add('hidden');notice.textContent=''}state.files.forEach((f,i)=>{const e=document.createElement('span');e.className='chip';e.innerHTML=esc(f.icon||'📎')+' '+esc(f.name)+' <button aria-label="移除 '+esc(f.name)+'">×</button>';e.querySelector('button').onclick=async()=>{try{const r=await fetch('/api/remove_temp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:f.name})});const d=await r.json();if(!d.ok)throw new Error(d.error||'移除失败')}catch(err){toast(err.message||'移除文件失败','error')}finally{state.files.splice(i,1);renderChips()}};box.append(e)});updateSendState()}
async function clearFiles(){try{const r=await fetch('/api/clear_uploads',{method:'POST'});const d=await r.json();if(!d.ok)throw new Error(d.error||'清除失败');state.files=[];renderChips();toast('已清除文件')}catch(e){toast(e.message||'清除文件失败','error')}}
async function clearChat(){if(!state.currentId)return;showConfirm('清空当前对话的全部消息？',async()=>{try{const r=await fetch('/api/app-new/conversations/'+state.currentId+'/clear',{method:'POST'});const d=await r.json();if(!d.ok)throw new Error(d.error||'清空失败');chat.innerHTML='';state.lastMessageAt=null;toast('已清空')}catch(e){toast(e.message||'清空失败','error')}})}
function showConfirm(text,onOk){const o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="dialog"><h3>请确认</h3><div>'+esc(text)+'</div><div class="dialog-actions"><button class="cancel">取消</button><button class="primary">确定</button></div></div>';o.querySelector('.cancel').onclick=()=>o.remove();o.querySelector('.primary').onclick=async()=>{o.remove();await onOk()};document.body.append(o)}
function resizeInput(){input.style.height='auto';const wanted=Math.min(input.scrollHeight,150);input.style.height=wanted+'px';input.style.overflowY=input.scrollHeight>150?'auto':'hidden';updateSendState()}
function toggleSidebar(){if(innerWidth<=720){const open=$('#sidebar').classList.toggle('open');$('#sidebarOverlay').classList.toggle('hidden',!open)}else{const hidden=$('#workspace').classList.toggle('sidebar-hidden');localStorage.setItem('sb_open',hidden?'0':'1')}}
function closeToolMenu(){const menu=$('#toolMenu'),btn=$('#toolMenuBtn');menu.classList.add('hidden');btn.classList.remove('open');btn.setAttribute('aria-expanded','false')}
function toggleToolMenu(e){e.stopPropagation();const menu=$('#toolMenu'),btn=$('#toolMenuBtn'),opening=menu.classList.contains('hidden');menu.classList.toggle('hidden',!opening);btn.classList.toggle('open',opening);btn.setAttribute('aria-expanded',opening?'true':'false')}
async function openHelp(){closeMobileSidebar();$('#helpPanel').classList.remove('hidden');$('#helpOverlay').classList.remove('hidden');if(state.helpLoaded)return;try{const r=await fetch('/api/app-new/help');if(r.status===401)return location.href='/login?next=/app-new';const d=await r.json();if(!d.ok)throw new Error(d.error||'帮助加载失败');$('#helpBody').innerHTML=d.html;state.helpLoaded=true}catch(e){$('#helpBody').innerHTML='<div class="status error">'+esc(e.message||'帮助加载失败')+'</div>'}}
function closeHelp(){$('#helpPanel').classList.add('hidden');$('#helpOverlay').classList.add('hidden')}
$('#newChat').onclick=createConversation;$('#menuBtn').onclick=toggleSidebar;$('#sidebarOverlay').onclick=closeMobileSidebar;$('#helpBtn').onclick=openHelp;$('#helpClose').onclick=closeHelp;$('#helpOverlay').onclick=closeHelp;$('#toolMenuBtn').onclick=toggleToolMenu;$('#toolMenu').onclick=e=>e.stopPropagation();$('#uploadBtn').onclick=()=>{closeToolMenu();$('#fileInput').click()};$('#fileInput').onchange=e=>{uploadFiles([...e.target.files]);e.target.value=''};$('#clearFiles').onclick=()=>{closeToolMenu();clearFiles()};$('#clearChat').onclick=()=>{closeToolMenu();clearChat()};$('#attachMode').onclick=e=>{state.asAttachment=!state.asAttachment;e.currentTarget.classList.toggle('active',state.asAttachment);e.currentTarget.textContent=state.asAttachment?'✓ 作为附件上传':'📁 作为附件上传';closeToolMenu()};sendBtn.onclick=()=>state.sending?cancelActiveTurn():send();input.oninput=resizeInput;input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};input.addEventListener('paste',e=>{const items=[...(e.clipboardData?.items||[])],images=items.filter(x=>x.kind==='file'&&x.type.startsWith('image/')).map(x=>{const blob=x.getAsFile();if(!blob)return null;const ext=(blob.type.split('/')[1]||'png').replace('jpeg','jpg');return new File([blob],'截图_'+Date.now()+'.'+ext,{type:blob.type})}).filter(Boolean);if(!images.length)return;e.preventDefault();uploadFiles(images)});$('#fileSelect').onchange=async e=>{const previous=state.wps?.default_file?.file_id||'';try{const r=await fetch('/api/switch_wps_file',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({file_id:e.target.value})});const d=await r.json();if(!d.ok)throw new Error(d.error||'切换失败');state.wps.default_file=(state.wps.files||[]).find(f=>f.file_id===e.target.value)||null;toast('已切换默认表格')}catch(err){if(previous)e.target.value=previous;toast(err.message||'切换表格失败','error')}};
$('#wpsBadge').onclick=e=>{e.stopPropagation();if(!state.wps?.connected){location.href=state.wps?.connect_url||'#';return}$('#wpsMenu').classList.toggle('hidden')};$('#wpsMenu').onclick=e=>e.stopPropagation();$('#wpsDisconnect').onclick=()=>{showConfirm('确认断开当前 WPS 授权吗？',async()=>{try{const r=await fetch('/api/app-new/wps/disconnect',{method:'POST'});const d=await r.json();if(!d.ok)throw new Error(d.error||'断开失败');state.wps.connected=false;$('#wpsMenu').classList.add('hidden');toast('已断开 WPS 授权');await bootstrap()}catch(e){toast(e.message||'断开 WPS 失败','error')}})};
function syncAppViewport(){const viewport=window.visualViewport;const height=Math.round(viewport?.height||window.innerHeight);document.documentElement.style.setProperty('--app-height',height+'px')}
syncAppViewport();window.visualViewport?.addEventListener('resize',syncAppViewport);window.visualViewport?.addEventListener('scroll',syncAppViewport);window.addEventListener('orientationchange',()=>setTimeout(syncAppViewport,80));
document.addEventListener('click',()=>{$('#wpsMenu').classList.add('hidden');closeToolMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeToolMenu();closeHelp();closeMobileSidebar()}});const composer=$('.composer');document.addEventListener('dragover',e=>{e.preventDefault();composer.classList.add('dragging')});document.addEventListener('dragleave',e=>{if(!e.relatedTarget)composer.classList.remove('dragging')});document.addEventListener('drop',e=>{e.preventDefault();composer.classList.remove('dragging');if(e.dataTransfer.files.length)uploadFiles([...e.dataTransfer.files])});window.addEventListener('resize',()=>{syncAppViewport();resizeInput();if(innerWidth>720)closeMobileSidebar()});resizeInput();bootstrap();
</script>
<script>document.getElementById('mobileHelpBtn').addEventListener('click',openHelp);document.getElementById('mobileUpdateBtn').addEventListener('click',async()=>{closeMobileSidebar();if(window.OpenNexusPWA)return window.OpenNexusPWA.checkForUpdate();try{const registration=await navigator.serviceWorker?.getRegistration('/');await registration?.update();location.reload()}catch{toast('检查更新失败，请稍后重试','error')}})</script>
</body></html>
