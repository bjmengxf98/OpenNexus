<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OpenNexus</title><link rel="manifest" href="/manifest.json"><link rel="icon" href="/static/icon-192.png"><link rel="apple-touch-icon" href="/static/apple-touch-icon.png"><meta name="theme-color" content="#4f46e5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><script defer src="/static/pwa.js?v=20260821-1"></script>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0e1a;color:#fff;font:14px/1.5 "Microsoft YaHei",sans-serif}.bg{position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,#1a2744 0,transparent 60%),radial-gradient(ellipse at 80% 20%,#0d2137 0,transparent 50%)}.card{position:relative;width:min(460px,calc(100vw - 28px));max-height:calc(100vh - 28px);overflow:auto;padding:46px 40px;border:1px solid #ffffff1a;border-radius:18px;background:#ffffff0a;backdrop-filter:blur(20px)}.brand{text-align:center;margin-bottom:30px}.brand b{display:block;font-size:32px;letter-spacing:3px;background:linear-gradient(135deg,#60a5fa,#a78bfa);background-clip:text;color:transparent}.brand h1{font-size:22px;margin:8px 0 3px}.brand p,.hint{color:#7f8ca6}.field{margin:16px 0}.field label{display:block;color:#9aa6ba;margin-bottom:7px}.field input{width:100%;padding:12px 15px;color:#fff;background:#ffffff0d;border:1px solid #ffffff1a;border-radius:9px;outline:none}.field input:focus{border-color:#4d8dff;background:#3b82f614}.field input:-webkit-autofill,.field input:-webkit-autofill:hover,.field input:-webkit-autofill:focus{-webkit-text-fill-color:#fff;caret-color:#fff;box-shadow:0 0 0 1000px #202a40 inset;transition:background-color 99999s ease-out}.btn{width:100%;padding:13px;margin-top:10px;border:0;border-radius:9px;color:white;background:linear-gradient(135deg,#3b82f6,#1d4ed8);font-weight:650;cursor:pointer}.btn:disabled{opacity:.55}.links{display:flex;justify-content:space-between;margin-top:20px}.links a{color:#5795ff;text-decoration:none}.msg{display:none;padding:11px 14px;margin-bottom:16px;border-radius:9px}.msg.error{display:block;color:#ff8c96;background:#ef444426;border:1px solid #ef44444d}.msg.success{display:block;color:#5ce393;background:#22c55e26;border:1px solid #22c55e4d}.remember{display:flex;gap:22px;margin:12px 0}.remember label{display:flex;gap:7px;align-items:center;color:#929db1}.remember input{accent-color:#4f8cff}.hidden{display:none!important}@media(max-width:520px){.card{padding:35px 24px}}</style></head>
<body><div class="bg"></div><main class="card"><div class="brand"><b>OpenNexus</b><h1 id="title"></h1><p id="subtitle"></p></div><div id="msg" class="msg"></div>
<form id="loginForm" class="hidden"><div class="field"><label>邮箱</label><input id="loginEmail" type="email" autocomplete="email" required></div><div class="field"><label>密码</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><div class="remember"><label><input id="rememberEmail" type="checkbox">记住账户</label><span class="hint">密码可由浏览器安全保存</span></div><button class="btn">登录</button><div class="links"><a href="/register">注册账号</a><a href="/forgot">忘记密码</a></div></form>
<form id="registerForm" class="hidden"><div class="field"><label>用户名 *</label><input id="regUsername" required></div><div class="field"><label>邮箱 *</label><input id="regEmail" type="email" required></div><div class="field"><label>密码 *</label><input id="regPassword" type="password" minlength="8" required></div><div class="field"><label>确认密码 *</label><input id="regPassword2" type="password" minlength="8" required></div><div class="field"><label>真实姓名</label><input id="regName"></div><div class="field"><label>单位 / 公司</label><input id="regOrg"></div><div class="field"><label>职务 / 职称</label><input id="regJob"></div><div class="field"><label>使用目的</label><input id="regPurpose"></div><button class="btn">注册</button><div class="links"><span></span><a href="/login">已有账号？立即登录</a></div></form>
<form id="forgotForm" class="hidden"><div class="field"><label>注册邮箱</label><input id="forgotEmail" type="email" required></div><button class="btn">发送重置邮件</button><div class="links"><a href="/login">返回登录</a></div></form>
<form id="resetForm" class="hidden"><div class="field"><label>新密码</label><input id="resetPassword" type="password" minlength="8" required></div><div class="field"><label>确认新密码</label><input id="resetPassword2" type="password" minlength="8" required></div><button class="btn">确认重置</button><div class="links"><a href="/login">返回登录</a></div></form>
<footer class="legal" style="margin:28px 0 0;padding-top:18px;border-top:1px solid #ffffff12;color:#7f8ca6;text-align:center;font-size:11px;line-height:1.75"><div>© 2026 <strong style="color:#aab4c7;font-weight:600">孟宪锋（Meng Xianfeng）</strong> · OpenNexus</div><div>自有代码依据 <a href="https://github.com/bjmengxf98/OpenNexus/blob/main/LICENSE" target="_blank" rel="noopener noreferrer" style="color:#7da7ef;text-decoration:none">Apache License 2.0</a> 授权</div></footer>
</main><script>
const mode=location.pathname.slice(1)||'login',titles={login:['多维表格智能助手','您的业务管理专家'],register:['创建账号','加入多维表格智能助手平台'],forgot:['忘记密码','输入注册邮箱，我们将发送重置链接'],reset:['重置密码','请输入您的新密码']};const $=id=>document.getElementById(id);$('title').textContent=titles[mode]?.[0]||'OpenNexus';$('subtitle').textContent=titles[mode]?.[1]||'';$(mode+'Form')?.classList.remove('hidden');
function msg(text,type='error'){const e=$('msg');e.textContent=text;e.className='msg '+type}async function post(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.msg||d.error||'请求失败');return d}function busy(form,on,text){const b=form.querySelector('button');b.disabled=on;b.textContent=on?text:form.dataset.normal}
const lf=$('loginForm');lf.dataset.normal='登录';lf.onsubmit=async e=>{e.preventDefault();busy(lf,true,'登录中…');const email=$('loginEmail').value.trim(),password=$('loginPassword').value;try{await post('/api/login',{email,password});$('rememberEmail').checked?localStorage.setItem('saved_email',email):localStorage.removeItem('saved_email');localStorage.removeItem('saved_password');const next=new URLSearchParams(location.search).get('next');const safeNext=next&&next.startsWith('/')&&!next.startsWith('//')?next:'/';busy(lf,true,'正在进入…');location.replace(safeNext)}catch(x){msg(x.message);busy(lf,false)}};
if(mode==='login'){const e=localStorage.getItem('saved_email');localStorage.removeItem('saved_password');if(e){$('loginEmail').value=e;$('rememberEmail').checked=true}}
const rf=$('registerForm');rf.dataset.normal='注册';rf.onsubmit=async e=>{e.preventDefault();if($('regPassword').value!==$('regPassword2').value)return msg('两次密码不一致');if($('regPassword').value.length<8)return msg('密码至少 8 位');busy(rf,true,'注册中…');try{const d=await post('/api/register',{username:$('regUsername').value.trim(),email:$('regEmail').value.trim(),password:$('regPassword').value,real_name:$('regName').value.trim(),organization:$('regOrg').value.trim(),job_title:$('regJob').value.trim(),purpose:$('regPurpose').value.trim()});msg('📧 '+(d.msg||'验证邮件已发送，请查收'),'success')}catch(x){msg(x.message)}finally{busy(rf,false)}};
const ff=$('forgotForm');ff.dataset.normal='发送重置邮件';ff.onsubmit=async e=>{e.preventDefault();busy(ff,true,'发送中…');try{await post('/api/forgot',{email:$('forgotEmail').value.trim()});msg('重置链接已发送，请查收邮件','success')}catch(x){msg(x.message)}finally{busy(ff,false)}};
const sf=$('resetForm');sf.dataset.normal='确认重置';sf.onsubmit=async e=>{e.preventDefault();const token=new URLSearchParams(location.search).get('token'),password=$('resetPassword').value;if(!token)return msg('链接无效，请重新申请重置密码');if(password.length<8)return msg('密码至少 8 位');if(password!==$('resetPassword2').value)return msg('两次密码不一致');busy(sf,true,'提交中…');try{await post('/api/reset_password',{token,password});msg('密码重置成功，即将返回登录页…','success');setTimeout(()=>location.href='/login',1200)}catch(x){msg(x.message)}finally{busy(sf,false)}};
</script></body></html>
