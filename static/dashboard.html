    button,select,input{font:inherit}.shell{max-width:1180px;margin:auto;padding:30px 32px 72px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:32px}.brand{display:flex;align-items:center;gap:14px}.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#1f6feb,#58a6ff);box-shadow:0 0 26px #1f6feb36;font-weight:900}.eyebrow{font-size:12px;color:var(--blue);letter-spacing:2px}.brand h1{font-size:21px;margin:3px 0 0}.actions{display:flex;gap:10px;align-items:center}.control,.btn{height:38px;border:1px solid var(--line);background:#161b22;color:var(--text);border-radius:8px;padding:0 12px}.control{min-width:220px}.btn{cursor:pointer;transition:.2s}.btn:hover{border-color:#58a6ff;background:#1b2533}.btn.primary{background:#1f6feb;border-color:#388bfd}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:22px;margin-bottom:23px}.hero h2{font-size:31px;margin:0 0 7px}.sub{color:var(--muted);font-size:14px}.tabs{display:flex;gap:5px;padding:4px;background:#161b22;border:1px solid var(--line);border-radius:9px}.tab{border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:7px;cursor:pointer}.tab.active{background:#1f6feb26;color:#79c0ff;box-shadow:inset 0 0 0 1px #1f6feb66}.datebar{display:none;align-items:center;gap:8px;margin:18px 0}.datebar.show{display:flex}.datebar input{color-scheme:dark}.date-note{margin-left:6px;color:var(--muted);font-size:13px}.grid{display:grid;gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}.block{padding:21px 22px}.block-title{font-size:18px;font-weight:700;margin-bottom:15px;color:var(--blue)}.block-title small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:4px}.dashboard-panel{margin-bottom:18px}.dashboard-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{padding:16px;min-height:105px;position:relative;overflow:hidden;background:var(--panel2)}.kpi:after{content:"";position:absolute;right:-24px;top:-24px;width:72px;height:72px;border-radius:50%;background:var(--accent);opacity:.08}.kpi-value{font-size:27px;font-weight:800;color:var(--accent)}.unit{font-size:12px;color:var(--muted);margin-left:4px}.kpi-label{margin-top:7px;font-size:13px}.primary-chart{background:var(--panel2);border:1px solid var(--line);border-radius:10px;min-height:100%;display:grid}.content-grid{grid-template-columns:minmax(0,1.35fr) minmax(310px,.65fr);align-items:start;margin-bottom:18px}.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.metric{padding:16px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}.metric strong{display:block;color:var(--accent);font-size:24px}.metric span{display:block;color:#c9d1d9;margin-top:7px;font-size:13px}.side{display:grid;gap:14px}.donut-wrap{display:flex;align-items:center;justify-content:center;gap:23px}.donut{width:184px;aspect-ratio:1;border-radius:50%;background:conic-gradient(#263344 0 100%);position:relative;flex:none}.donut:after{content:"";position:absolute;inset:29%;border-radius:50%;background:var(--panel2)}.donut-center{position:absolute;inset:0;z-index:1;display:grid;place-content:center;text-align:center;font-weight:800;font-size:25px}.donut-center small{font-size:12px;color:var(--muted);font-weight:400;margin-top:4px}.legend{display:grid;gap:9px;min-width:130px}.legend-row{display:flex;align-items:center;gap:8px;font-size:12px;color:#c9d1d9}.dot{width:9px;height:9px;border-radius:50%;flex:none}.legend-row b{margin-left:auto;color:#fff}.insights{display:grid;gap:9px}.insight{padding:11px 12px;background:#0d1117;border-left:3px solid var(--blue);border-radius:6px;color:#c9d1d9;font-size:13px;line-height:1.65}.report-section{margin-bottom:18px;padding:21px 22px}.section-no{color:var(--blue);font-size:18px;font-weight:750;margin:0 0 14px}.narrative{font-size:14px;line-height:1.9;color:#c9d1d9;margin:0}.analysis-badge{float:right;font-size:11px;font-weight:400;color:#8b949e;border:1px solid #30363d;border-radius:20px;padding:2px 8px}.highlight-box{background:#f0b72f12;border-color:#f0b72f55}.highlight-box .section-no{color:var(--gold)}.analysis-list{margin:0;padding-left:20px;color:#c9d1d9;font-size:14px;line-height:1.85}.analysis-list li{margin:7px 0}.analysis-list b{color:#e6edf3}.people-list{display:grid;gap:16px}.person{border-left:3px solid var(--blue);padding:2px 0 2px 14px}.person-head{font-weight:700;font-size:15px}.tag{display:inline-block;font-size:11px;background:#1f6feb22;color:#79c0ff;border-radius:6px;padding:1px 8px;margin-left:8px}.person ul{margin:6px 0 0;padding-left:19px;color:#c9d1d9;font-size:14px;line-height:1.75}.section{margin-top:18px;padding:21px 22px}.items{grid-template-columns:repeat(2,minmax(0,1fr))}.item{background:#0d1117;border:1px solid var(--line);border-radius:10px;padding:15px;min-height:105px}.item h4{margin:0 0 7px;font-size:14px}.item .meta{color:var(--blue);font-size:12px;margin-bottom:8px}.item p{margin:0;color:#aeb8c4;font-size:13px;line-height:1.7;white-space:pre-wrap}.raw-details>summary{cursor:pointer;color:#8b949e;font-size:13px;padding:4px 0}.raw-details .section{margin-top:12px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:9px}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:12px 13px;text-align:left;border-bottom:1px solid #21262d;font-size:13px}th{color:#8b949e;background:#0d1117;font-weight:500;position:sticky;top:0}td{color:#c9d1d9}.badge{display:inline-flex;padding:3px 8px;border-radius:20px;background:#243143;color:#bcd6f5;font-size:11px}.badge.overdue{background:#492229;color:#ff9a9a}.empty{padding:38px 20px;text-align:center;color:var(--muted)}.loading{display:none;padding:90px 20px;text-align:center;color:var(--muted)}.loading.show{display:block}.spinner{width:32px;height:32px;border:3px solid #243349;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 15px}@keyframes spin{to{transform:rotate(360deg)}}.error{display:none;border:1px solid #61323b;background:#2c161b;color:#ffb2b2;border-radius:12px;padding:18px;margin-top:18px}.error.show{display:block}.footer{color:#6e7681;font-size:12px;margin-top:24px;text-align:center}
    @media(max-width:900px){.dashboard-grid,.content-grid{grid-template-columns:1fr}.items{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:700px){.shell{padding:18px 14px 45px}.topbar,.hero{align-items:flex-start;flex-direction:column}.actions{width:100%;flex-wrap:wrap}.control{min-width:0;flex:1}.hero h2{font-size:27px}.tabs{width:100%;overflow:auto}.tab{white-space:nowrap;padding:8px 12px}.kpis{grid-template-columns:repeat(2,1fr);gap:10px}.kpi{min-height:115px;padding:16px}.kpi-value{font-size:25px}.block,.section{padding:17px}.metric-grid,.items{grid-template-columns:1fr}.donut-wrap{flex-direction:column}.date-note{display:none}}
    .notice{position:fixed;z-index:1000;right:28px;top:112px;width:min(390px,calc(100vw - 28px));padding:15px 16px;background:#161b22;border:1px solid #388bfd;border-radius:11px;box-shadow:0 14px 42px #0008;display:none}.notice.show{display:block;animation:noticeIn .2s ease-out}.notice.success{border-color:#3fb950}.notice.error{border-color:#ff7b72}.notice-row{display:flex;align-items:center;gap:11px}.notice-icon{width:22px;height:22px;border:3px solid #30445d;border-top-color:#58a6ff;border-radius:50%;animation:spin .8s linear infinite;flex:none}.notice.success .notice-icon,.notice.error .notice-icon{border:0;animation:none;display:grid;place-items:center;font-size:20px}.notice-title{font-size:14px;font-weight:700}.notice-detail{font-size:12px;color:#8b949e;margin-top:3px;line-height:1.5}.progress-track{height:3px;background:#263244;border-radius:4px;overflow:hidden;margin-top:12px}.progress-runner{height:100%;width:38%;background:linear-gradient(90deg,#1f6feb,#79c0ff);border-radius:4px;animation:progressRun 1.3s ease-in-out infinite}.notice.success .progress-track,.notice.error .progress-track{display:none}.btn.busy:before{content:"";display:inline-block;width:13px;height:13px;margin-right:7px;border:2px solid #44556b;border-top-color:#79c0ff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}@keyframes progressRun{0%{transform:translateX(-110%)}100%{transform:translateX(270%)}}@keyframes noticeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}@media(max-width:700px){.notice{right:14px;top:14px;width:calc(100vw - 28px)}}
    .confirm-dialog{width:min(510px,calc(100vw - 32px));padding:0;border:1px solid #334155;border-radius:16px;background:#161b22;color:var(--text);box-shadow:0 28px 90px #000c;overflow:hidden}.confirm-dialog::backdrop{background:#05080db8;backdrop-filter:blur(4px)}.confirm-dialog[open]{animation:dialogIn .18s ease-out}.confirm-head{display:flex;gap:14px;padding:23px 24px 16px}.confirm-mark{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;background:#1f6feb24;color:#79c0ff;border:1px solid #388bfd66;font-size:20px}.confirm-copy h3{margin:1px 0 7px;font-size:19px}.confirm-copy p{margin:0;color:#aeb8c4;font-size:14px;line-height:1.7}.confirm-note{margin:0 24px 20px;padding:11px 13px;border-left:3px solid #f0b72f;background:#f0b72f0d;color:#c9d1d9;border-radius:6px;font-size:12px;line-height:1.6}.confirm-actions{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;background:#0d111766;border-top:1px solid #30363d}.confirm-actions .btn{min-width:92px}.confirm-actions .btn.primary{font-weight:700}@keyframes dialogIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}@media(max-width:700px){.confirm-head{padding:20px 18px 14px}.confirm-note{margin:0 18px 18px}.confirm-actions{padding:14px 18px}}
    @supports(min-height:100dvh){body{min-height:100dvh}}
    @media(max-width:700px){.shell{padding-top:calc(18px + env(safe-area-inset-top));padding-right:calc(14px + env(safe-area-inset-right));padding-bottom:calc(45px + env(safe-area-inset-bottom));padding-left:calc(14px + env(safe-area-inset-left))}.topbar{margin-bottom:22px}.actions .btn{flex:1}.datebar{flex-wrap:wrap}.datebar .btn{flex:1}.table-wrap{border:0;overflow:visible}table{min-width:0}table thead{display:none}table,table tbody,table tr,table td{display:block;width:100%}table tr{margin-bottom:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#0d1117}table td{padding:7px 0;border:0}table td:empty{display:none}}
    @media(max-width:700px){table td:not(.empty){display:grid;grid-template-columns:minmax(86px,34%) 1fr;gap:10px;align-items:start}table td:not(.empty)::before{content:attr(data-label);color:var(--muted);font-weight:600}}
  </style>
</head>
<body>
<div id="notice" class="notice" role="status" aria-live="polite"><div class="notice-row"><div id="noticeIcon" class="notice-icon"></div><div><div id="noticeTitle" class="notice-title"></div><div id="noticeDetail" class="notice-detail"></div></div></div><div class="progress-track"><div class="progress-runner"></div></div></div>
<dialog id="aiConfirm" class="confirm-dialog" aria-labelledby="aiConfirmTitle">
  <div class="confirm-head"><div class="confirm-mark">✦</div><div class="confirm-copy"><h3 id="aiConfirmTitle">重新生成智能分析</h3><p>大模型将重新阅读当前页面的数据，并更新文字分析报告。</p></div></div>
  <div class="confirm-note">当前页面涉及的 WPS 工作数据将发送给您在“设置”中配置的大模型。原始表格不会被修改。</div>
  <div class="confirm-actions"><button id="aiCancelBtn" class="btn" type="button">取消</button><button id="aiConfirmBtn" class="btn primary" type="button">继续生成</button></div>
</dialog>
<main class="shell">
  <header class="topbar">
    <div class="brand"><div class="logo">NX</div><div><div class="eyebrow">OPENNEXUS</div><h1>部门智能驾驶舱</h1></div></div>
    <div class="actions"><select id="fileSelect" class="control" aria-label="数据文件"></select><button class="btn" onclick="location.href='/'">返回助手</button><button id="aiBtn" class="btn">重新生成智能分析</button><button id="refreshBtn" class="btn primary">刷新数据</button></div>
  </header>
  <section class="hero"><div><h2 id="pageTitle">部门整体驾驶舱</h2><div id="subtitle" class="sub">正在准备数据…</div></div><nav class="tabs"><button class="tab active" data-view="overview">整体情况</button><button class="tab" data-view="daily">每日进展</button><button class="tab" data-view="tasks">任务分析</button><button class="tab" data-view="projects">项目分析</button></nav></section>
  <div id="datebar" class="datebar"><button id="prevDate" class="btn">← 前一天</button><input id="dateInput" class="control" type="date"><button id="nextDate" class="btn">后一天 →</button><span class="date-note">历史日期展示当日已保存快照</span></div>
  <div id="error" class="error"></div><div id="loading" class="loading"><div class="spinner"></div>正在读取 WPS 多维表格并生成分析…</div>
  <div id="dashboard" hidden>
    <section class="card block dashboard-panel"><div class="block-title">部门工作仪表盘</div><div class="dashboard-grid"><div id="kpis" class="grid kpis"></div><div id="primaryChart" class="primary-chart"></div></div></section>
    <section class="grid content-grid"><div class="card block"><div class="block-title">业务量识别<small>从有效填报内容中自动识别数量与业务指标</small></div><div id="metrics" class="grid metric-grid"></div></div><aside id="side" class="side"></aside></section>
    <div id="reportSections"></div>
    <details class="raw-details"><summary>查看原始数据明细</summary><div id="sections"></div></details><div id="footer" class="footer"></div>
  </div>
</main>
<script>
const state={view:'overview',date:new Date().toLocaleDateString('sv-SE'),fileId:'',dates:[],controller:null,requestSeq:0,hasData:false};
const colors=['#58a6ff','#79c0ff','#f0b72f','#3fb950','#db61a2','#a78bfa','#39c5cf','#f97316'];
const $=id=>document.getElementById(id); const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
let noticeTimer=null,noticeStarted=0,noticeHideTimer=null;
function beginNotice(title,detail){clearInterval(noticeTimer);clearTimeout(noticeHideTimer);noticeStarted=Date.now();$('notice').className='notice show';$('noticeIcon').textContent='';$('noticeTitle').textContent=title;$('noticeDetail').textContent=detail;noticeTimer=setInterval(()=>{$('noticeDetail').textContent=`${detail} · 已等待 ${Math.floor((Date.now()-noticeStarted)/1000)} 秒`},1000)}
function finishNotice(ok,title,detail){clearInterval(noticeTimer);clearTimeout(noticeHideTimer);$('notice').className=`notice show ${ok?'success':'error'}`;$('noticeIcon').textContent=ok?'✓':'!';$('noticeTitle').textContent=title;$('noticeDetail').textContent=detail;noticeHideTimer=setTimeout(()=>{$('notice').classList.remove('show')},ok?5000:9000)}
const fmt=v=>typeof v==='number'?new Intl.NumberFormat('zh-CN').format(v):esc(v||0);
function accent(name){return {blue:'#58a6ff',cyan:'#6dc8ff',gold:'#f5bd38',green:'#40c463',pink:'#e55f9f',red:'#ff6b6b'}[name]||'#58a6ff'}
async function api(url,signal){const r=await fetch(url,{credentials:'same-origin',signal});if(r.status===401){location.href='/login?next=/dashboard';throw Error('登录已失效')}let j;try{j=await r.json()}catch{throw Error('服务器返回了无效数据')}if(!r.ok||!j.ok)throw Error(j.error||'请求失败');return j}
async function loadFiles(){const j=await api('/api/dashboard/files');$('fileSelect').innerHTML=j.files.map(f=>`<option value="${esc(f.file_id)}">${esc(f.file_name)}${f.is_default?'（默认）':''}</option>`).join('');state.fileId=j.default_file_id||(j.files[0]||{}).file_id||'';$('fileSelect').value=state.fileId;if(!state.fileId)throw Error('尚未配置 WPS 多维表格，请先到设置中添加文件')}
function setBusy(on,preserve=false){$('loading').classList.toggle('show',on&&!preserve);$('dashboard').hidden=on&&!preserve;$('dashboard').style.opacity=on&&preserve?'.8':'1';$('refreshBtn').disabled=on}
function setError(msg=''){$('error').textContent=msg;$('error').classList.toggle('show',!!msg)}
function renderKpis(items=[]){$('kpis').innerHTML=items.map(k=>`<article class="card kpi" style="--accent:${accent(k.color||k.tone)}"><div><span class="kpi-value">${fmt(k.value)}</span><span class="unit">${esc(k.unit||'')}</span></div><div class="kpi-label">${esc(k.label)}</div></article>`).join('')||'<div class="empty">暂无指标</div>'}
function renderMetrics(items=[]){$('metrics').innerHTML=items.length?items.map((m,i)=>`<div class="metric" style="--accent:${colors[i%colors.length]}"><strong>${fmt(m.value)}<span class="unit">${esc(m.unit||'')}</span></strong><span>${esc(m.label)}</span></div>`).join(''):'<div class="empty">未从内容中识别到额外数量指标</div>'}
function renderDonut(d,embedded=false){let total=(d.items||[]).reduce((s,x)=>s+(Number(x.value)||0),0),pos=0,stops=[];(d.items||[]).forEach((x,i)=>{let end=pos+(total?Number(x.value)/total*100:0);stops.push(`${colors[i%colors.length]} ${pos}% ${end}%`);pos=end});return `<div class="${embedded?'':'card '}block"><div class="block-title">${esc(d.title)}</div><div class="donut-wrap"><div class="donut" style="background:conic-gradient(${stops.join(',')||'#263344 0 100%'})"><div class="donut-center">${fmt(total)}<small>条记录</small></div></div><div class="legend">${(d.items||[]).slice(0,10).map((x,i)=>`<div class="legend-row"><i class="dot" style="background:${colors[i%colors.length]}"></i><span>${esc(x.label)}</span><b>${fmt(x.value)}</b></div>`).join('')}</div></div></div>`}
function renderSide(data){const distributions=data.distributions||[];$('primaryChart').innerHTML=distributions.length?renderDonut(distributions[0],true):'<div class="empty">暂无分布数据</div>';let html=distributions.slice(1).map(d=>renderDonut(d)).join('');if((data.insights||[]).length)html+=`<div class="card block"><div class="block-title">数据提示</div><div class="insights">${data.insights.map(x=>`<div class="insight">${esc(x)}</div>`).join('')}</div></div>`;$('side').innerHTML=html||'<div class="card empty">暂无其他提示</div>'}
function analysisItems(items=[]){return `<ul class="analysis-list">${items.map(x=>{if(typeof x==='string')return `<li>${esc(x)}</li>`;return `<li><b>${esc(x.title||'重点事项')}</b>：${esc(x.body||x.content||'')}</li>`}).join('')}</ul>`}
function renderReport(data){const r=data.report||{},parts=[];parts.push(`<section class="card report-section"><h3 class="section-no">一、总体概况 <span class="analysis-badge">${r.source==='ai'?'AI 深度分析':'智能规则分析'}</span></h3><p class="narrative">${esc(r.overview||'暂无足够数据形成总体概况。')}</p></section>`);if((r.highlights||[]).length)parts.push(`<section class="card report-section highlight-box"><h3 class="section-no">二、工作亮点</h3>${analysisItems(r.highlights)}</section>`);if((r.people||[]).length)parts.push(`<section class="card report-section"><h3 class="section-no">三、各人工作详述</h3><div class="people-list">${r.people.map(p=>`<div class="person"><div class="person-head">${esc(p.name||'未注明')}<span class="tag">${esc(p.tag||'综合工作')}</span></div><ul>${(p.items||[]).map(x=>`<li>${esc(typeof x==='string'?x:x.body||x.title||'')}</li>`).join('')}</ul></div>`).join('')}</div></section>`);if((r.followups||[]).length)parts.push(`<section class="card report-section"><h3 class="section-no">四、待跟进 / 风险事项</h3>${analysisItems(r.followups)}</section>`);if((r.recommendations||[]).length)parts.push(`<section class="card report-section"><h3 class="section-no">五、观察与建议</h3>${analysisItems(r.recommendations)}</section>`);$('reportSections').innerHTML=parts.join('')}
function cards(sec){return `<div class="grid items">${(sec.items||[]).map(x=>{const body=Array.isArray(x.lines)?x.lines.join('\n'):x.content||x.detail||x.progress||'';return `<article class="item"><h4>${esc(x.title||x.name||'未命名')}</h4><div class="meta">${esc(x.subtitle||x.owner||x.status||'')}</div><p>${esc(body)}</p></article>`}).join('')||'<div class="empty">该日期暂无有效记录</div>'}</div>`}
function table(sec){const cols=sec.columns||[];return `<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${esc(typeof c==='string'?c:c.label)}</th>`).join('')}</tr></thead><tbody>${(sec.items||[]).map(row=>`<tr>${cols.map(c=>{const key=typeof c==='string'?c:c.key,label=typeof c==='string'?c:c.label;let v=row[key]??'';if(key==='status')return `<td data-label="${esc(label)}"><span class="badge ${row.overdue?'overdue':''}">${esc(v)}</span></td>`;return `<td data-label="${esc(label)}">${esc(v)}</td>`}).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length||1}" class="empty">暂无数据</td></tr>`}</tbody></table></div>`}
function renderSections(items=[]){$('sections').innerHTML=items.map(s=>`<section class="card section"><div class="block-title">${esc(s.title)}</div>${s.type==='table'?table(s):cards(s)}</section>`).join('')}
function render(data){$('pageTitle').textContent=data.title||'部门智能驾驶舱';const src=data.source||{};$('subtitle').textContent=`分析日期：${data.date||state.date} · 数据来源：${src.file_name||'WPS 多维表格'}${src.sheet_name?' → '+src.sheet_name:''}`;renderKpis(data.kpis);renderMetrics(data.metrics);renderSide(data);renderReport(data);renderSections(data.sections);$('footer').textContent=`本报告由 OpenNexus 基于 WPS 多维表格自动汇总生成 · 生成时间：${data.generated_at||'--'}${data.cached?' · 已保存快照':' · 实时生成'} · 数据如有出入，以多维表原始记录为准`}
async function loadDates(){if(!state.fileId)return;try{const j=await api('/api/dashboard/dates?view=daily&file_id='+encodeURIComponent(state.fileId));state.dates=j.dates||[]}catch(e){if(e.name!=='AbortError')console.warn(e)}}
async function load(refresh=false,useAi=false){if(state.controller)state.controller.abort();state.controller=new AbortController();const seq=++state.requestSeq;setError();setBusy(true,state.hasData);$('aiBtn').disabled=true;const oldSub=$('subtitle').textContent;if(useAi){$('aiBtn').classList.add('busy');$('aiBtn').textContent='智能分析生成中…';beginNotice('正在重新生成智能分析','大模型正在阅读当前报告并生成总结');if(state.hasData)$('subtitle').textContent='大模型正在重新分析当前报告，请稍候…'}else if(state.hasData)$('subtitle').textContent=refresh?'正在从 WPS 同步最新数据…':'正在切换本地报告…';try{const q=new URLSearchParams({view:state.view,date:state.date,file_id:state.fileId});if(refresh)q.set('refresh','true');if(useAi)q.set('ai_summary','true');const j=await api('/api/dashboard/data?'+q,state.controller.signal);if(seq!==state.requestSeq)return;render(j.data);state.hasData=true;$('dashboard').hidden=false;if(useAi){const report=j.data.report||{};if(report.ai_status==='success'&&report.source==='ai')finishNotice(true,'智能分析已更新',`已更新当前${state.view==='daily'?'日期':'页面'}的文字报告 · ${j.data.generated_at||''}`);else finishNotice(false,'智能分析生成失败',report.ai_error||'已保留原有本地分析结果')}if(state.view==='daily')loadDates()}catch(e){if(e.name==='AbortError'){if(useAi&&seq===state.requestSeq)finishNotice(false,'智能分析已取消','页面或日期发生切换，本次生成已停止')}else if(seq===state.requestSeq){setError(e.message);$('subtitle').textContent=oldSub;if(useAi)finishNotice(false,'智能分析生成失败',e.message)}}finally{if(seq===state.requestSeq){setBusy(false);$('aiBtn').disabled=false;$('aiBtn').classList.remove('busy');$('aiBtn').textContent='重新生成智能分析'}}}
function shiftDate(n){let next='';const idx=state.dates.indexOf(state.date);if(idx>=0){next=state.dates[idx+(n<0?1:-1)]||''}else if(state.dates.length){next=n<0?(state.dates.find(d=>d<state.date)||''):([...state.dates].reverse().find(d=>d>state.date)||'')}if(!next){let d=new Date(state.date+'T12:00:00');d.setDate(d.getDate()+n);next=d.toLocaleDateString('sv-SE')}const today=new Date().toLocaleDateString('sv-SE');if(next>today)return;state.date=next;$('dateInput').value=next;load()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.view=b.dataset.view;$('datebar').classList.toggle('show',state.view==='daily');if(state.view==='daily')loadDates();load()});
$('fileSelect').onchange=e=>{state.fileId=e.target.value;state.hasData=false;loadDates();load()};$('refreshBtn').onclick=()=>load(true);$('aiBtn').onclick=()=>$('aiConfirm').showModal();$('aiCancelBtn').onclick=()=>$('aiConfirm').close();$('aiConfirmBtn').onclick=()=>{$('aiConfirm').close();load(false,true)};$('aiConfirm').onclick=e=>{if(e.target===$('aiConfirm'))$('aiConfirm').close()};$('prevDate').onclick=()=>shiftDate(-1);$('nextDate').onclick=()=>shiftDate(1);$('dateInput').onchange=e=>{state.date=e.target.value;load()};$('dateInput').value=state.date;$('dateInput').max=state.date;
(async()=>{try{setBusy(true);await loadFiles();await loadDates();await load()}catch(e){setBusy(false);setError(e.message)}})();
</script>
</body>
</html>
