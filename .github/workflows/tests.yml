name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest test_reminders.py test_dashboard.py test_app_new.py test_pwa.py test_admin_settings_new.py test_mcp_business_execution.py test_mcp_preauthorization.py test_tool_governance.py test_tool_planner.py test_document_generator.py test_wps_file_structure.py test_wps_session.py test_wps_status_ui.py test_wps_oauth_config.py test_memory_management.py test_context_memory.py -q
